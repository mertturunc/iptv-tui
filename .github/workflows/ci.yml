name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -short ./...
      - name: cross-compile windows
        run: GOOS=windows go build ./...
      - name: cross-compile darwin
        run: GOOS=darwin go build ./...
  e2e:
    name: e2e (headless theme)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run headless E2E
        run: go test ./internal/tui/ -run TestHeadlessThemeSwitchE2E -count=1 -v
        continue-on-error: true
